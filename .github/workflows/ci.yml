name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d project_1_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/project_1_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/project_1_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/project_1_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-test-secret-key-at-least-32-characters-long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format check
        run: bun run lint

      - name: Check OpenAPI snapshot
        run: bun run docs:check

      - name: Run database migrations against test Postgres
        run: bun run db:migrate

      - name: Run unit and integration tests
        run: bun test
