$kind: http-request
method: GET
url: '{{baseUrl}}/v1/seo/sitemap'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns sitemap slug index', () => {
        const json = pm.response.json();
        pm.expect(json.data.categories).to.be.an('array');
        pm.expect(json.data.articles).to.be.an('array');
      });
