$kind: http-request
method: GET
url: '{{baseUrl}}/v1/categories?tree=true'
order: 1000
queryParams:
  - key: tree
    value: 'true'
    description: Nest subcategories under root categories
  - key: parentId
    value: '{{categoryId}}'
    disabled: true
    description: Optional parent category UUID filter
  - key: rootOnly
    value: 'true'
    disabled: true
    description: Optional root filter (true = top-level only, false = subcategories only)
  - key: q
    value: perkins
    disabled: true
    description: Optional fuzzy text search query
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Includes Cache-Control and ETag headers', () => {
        pm.expect(pm.response.headers.get('ETag')).to.be.a('string');
      });
