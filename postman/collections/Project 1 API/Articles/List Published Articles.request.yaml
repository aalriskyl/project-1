$kind: http-request
method: GET
url: '{{baseUrl}}/v1/articles?limit=10'
order: 1000
queryParams:
  - key: limit
    value: '10'
  - key: tag
    value: genset
    disabled: true
  - key: q
    value: genset silent
    disabled: true
    description: Optional fuzzy text search query
  - key: cursor
    value: ''
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
