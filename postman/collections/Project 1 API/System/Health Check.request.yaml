$kind: http-request
method: GET
url: '{{baseUrl}}/health'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Health status is ok', () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('ok');
      });
