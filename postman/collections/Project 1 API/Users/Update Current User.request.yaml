$kind: http-request
method: PATCH
url: '{{baseUrl}}/v1/users/me'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Ada Byron",
      "phone": "+6281234567890",
      "address": "Jl. Industri Raya No. 45, Cikarang, Bekasi"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Updates name and address', () => {
        const json = pm.response.json();
        pm.expect(json.data.name).to.eql('Ada Byron');
        pm.expect(json.data.address).to.be.a('string');
      });