$kind: http-request
name: 'List Users (Admin)'
method: GET
url: '{{baseUrl}}/v1/users?limit=20'
order: 4000
queryParams:
  - key: limit
    value: '20'
    description: Page size (1..100)
  - key: page
    value: '1'
    disabled: true
    description: Optional 1-based page number (returns total & totalPages in meta)
  - key: q
    value: admin
    disabled: true
    description: Optional fuzzy text search across displayName, email, phone, and address
  - key: role
    value: user
    disabled: true
    description: Optional role filter (user or admin)
  - key: status
    value: active
    disabled: true
    description: Optional lifecycle status filter (active or inactive)
  - key: createdFrom
    value: '2026-11-01'
    disabled: true
    description: Optional start date/datetime filter (ISO 8601)
  - key: createdTo
    value: '2026-11-30'
    disabled: true
    description: Optional end date/datetime filter (ISO 8601)
  - key: cursor
    value: ''
    disabled: true
    description: Next page cursor returned from previous response meta.nextCursor
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Returns 200 for admin or 403 for standard user', () => {
        pm.expect([200, 403]).to.include(pm.response.code);
      });
