$kind: http-request
method: PATCH
url: '{{baseUrl}}/v1/products/:id/reviews/me'
order: 5600
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{productId}}'
    description: Product UUIDv7
body:
  type: json
  content: |-
    {
      "rating": 4,
      "comment": "Updated review after 3 months of daily operation."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns updated review envelope', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.rating).to.eql(4);
      });