$kind: http-request
method: DELETE
url: '{{baseUrl}}/v1/products/:id/reviews/me'
order: 5700
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: id
    value: '{{productId}}'
    description: Product UUIDv7
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 204 No Content', () => {
        pm.response.to.have.status(204);
      });