$kind: http-request
method: POST
url: '{{baseUrl}}/v1/products/:id/reviews'
order: 5500
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{productId}}'
    description: Product UUIDv7 (auto-populated by List & Search Products)
body:
  type: json
  content: |-
    {
      "rating": 5,
      "comment": "Mesin halus, pengiriman tepat waktu, dan purna jual responsif."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201 Created', () => {
        pm.response.to.have.status(201);
      });
      if (pm.response.code === 201) {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        if (json.data?.id) {
          pm.environment.set('reviewId', json.data.id);
        }
      }
