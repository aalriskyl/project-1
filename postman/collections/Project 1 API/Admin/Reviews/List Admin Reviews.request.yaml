$kind: http-request
method: GET
url: '{{baseUrl}}/v1/admin/reviews?limit=20'
order: 5900
queryParams:
  - key: limit
    value: '20'
  - key: page
    value: '1'
    disabled: true
    description: Optional 1-based page number (returns total & totalPages in meta)
  - key: isPublished
    value: 'true'
    disabled: true
  - key: rating
    value: '5'
    disabled: true
  - key: productId
    value: '{{productId}}'
    disabled: true
  - key: cursor
    value: ''
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns standardized paginated reviews list', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data).to.be.an('array');
        if (json.data[0]?.id) {
          pm.environment.set('reviewId', json.data[0].id);
        }
      });
