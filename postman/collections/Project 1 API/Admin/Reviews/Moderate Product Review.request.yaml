$kind: http-request
method: PATCH
url: '{{baseUrl}}/v1/admin/reviews/:id'
order: 6000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{reviewId}}'
    description: Product review UUIDv7 (auto-populated by List/Create Product Review)
body:
  type: json
  content: |-
    {
      "isPublished": true,
      "status": "active"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns standardized review envelope', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
      });
