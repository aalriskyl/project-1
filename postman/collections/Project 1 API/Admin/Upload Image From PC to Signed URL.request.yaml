$kind: http-request
method: PUT
url: '{{uploadUrl}}'
order: 3600
auth:
  type: noauth
headers:
  - key: Content-Type
    value: image/png
    description: Match the contentType requested in Create Presigned Media Upload URL (image/png, image/jpeg, image/webp, image/avif)
body:
  type: file
  content:
    src: ''
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('File uploaded to Supabase Storage (200 OK)', () => {
        pm.response.to.have.status(200);
      });
