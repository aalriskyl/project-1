$kind: http-request
method: PATCH
url: '{{baseUrl}}/v1/admin/reviews/:id'
order: 6000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '01936c8e-7f2a-7000-8000-000000000601'
    description: Product review UUIDv7
body:
  type: json
  content: |-
    {
      "isPublished": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
