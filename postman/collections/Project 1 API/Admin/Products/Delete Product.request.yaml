$kind: http-request
method: DELETE
url: '{{baseUrl}}/v1/admin/products/:id'
order: 4300
pathVariables:
  - key: id
    value: '{{productId}}'
    description: Product UUIDv7
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 204 No Content', () => {
        pm.response.to.have.status(204);
      });
