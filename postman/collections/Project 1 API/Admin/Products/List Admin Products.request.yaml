$kind: http-request
method: GET
url: '{{baseUrl}}/v1/admin/products?limit=20'
order: 3900
queryParams:
  - key: limit
    value: '20'
  - key: page
    value: '1'
    disabled: true
    description: Optional 1-based page number (returns total & totalPages in meta)
  - key: q
    value: gensset perkns
    disabled: true
    description: Optional fuzzy text search query
  - key: status
    value: active
    disabled: true
    description: Optional lifecycle status filter (active or inactive)
  - key: categoryId
    value: '{{categoryId}}'
    disabled: true
    description: Optional category UUID filter
  - key: brandSlug
    value: perkins,cummins
    disabled: true
    description: Optional single or comma-separated brand slugs
  - key: type
    value: equipment
    disabled: true
    description: Optional product type filter (equipment or sparepart)
  - key: isFeatured
    value: 'true'
    disabled: true
    description: Optional featured flag filter
  - key: requiresQuote
    value: 'false'
    disabled: true
    description: Optional RFQ-only flag filter
  - key: inStock
    value: 'true'
    disabled: true
    description: Optional stock filter (true for stock > 0, false for stock = 0)
  - key: createdFrom
    value: '2026-11-01'
    disabled: true
    description: Optional start date/datetime filter (ISO 8601)
  - key: createdTo
    value: '2026-11-30'
    disabled: true
    description: Optional end date/datetime filter (ISO 8601)
  - key: cursor
    value: ''
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns standardized paginated products list', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data).to.be.an('array');
        if (json.data[0]?.id) {
          pm.environment.set('productId', json.data[0].id);
        }
      });
