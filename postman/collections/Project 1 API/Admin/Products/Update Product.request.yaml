$kind: http-request
method: PATCH
url: '{{baseUrl}}/v1/admin/products/:id'
order: 4200
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{productId}}'
    description: Product UUIDv7
body:
  type: json
  content: |-
    {
      "stock": 5,
      "isFeatured": true,
      "focusKeyword": "genset 30 kva silent perkins",
      "noIndex": false,
      "status": "active",
      "customSpecs": [
        {
          "label": "Alternator",
          "value": "Stamford UCI224D"
        },
        {
          "label": "Control Panel",
          "value": "DeepSea DSE4520"
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns updated product envelope', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.id).to.be.a('string');
      });
