$kind: http-request
method: PATCH
url: '{{baseUrl}}/v1/admin/categories/:id'
order: 1700
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{categoryId}}'
    description: Category UUIDv7
body:
  type: json
  content: |-
    {
      "metaTitle": "Jual Genset Silent 10-500 kVA Resmi | Tsuzumi Japan",
      "focusKeyword": "genset silent",
      "noIndex": false,
      "status": "active"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns updated category envelope', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.id).to.be.a('string');
      });
