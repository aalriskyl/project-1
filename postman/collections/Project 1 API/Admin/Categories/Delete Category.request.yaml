$kind: http-request
method: DELETE
url: '{{baseUrl}}/v1/admin/categories/:id'
order: 1800
pathVariables:
  - key: id
    value: '{{categoryId}}'
    description: Category UUIDv7 (soft-deletes to status=inactive; must have no active subcategories or products)
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 204 No Content', () => {
        pm.response.to.have.status(204);
      });
