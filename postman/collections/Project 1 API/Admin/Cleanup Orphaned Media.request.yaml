$kind: http-request
method: POST
url: '{{baseUrl}}/v1/admin/media/cleanup-orphans'
order: 3700
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "olderThanHours": 24,
      "limit": 100
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns orphan sweep counts', () => {
        const json = pm.response.json();
        pm.expect(json.data.scannedCount).to.be.a('number');
        pm.expect(json.data.deletedCount).to.be.a('number');
        pm.expect(json.data.deletedPaths).to.be.an('array');
      });
