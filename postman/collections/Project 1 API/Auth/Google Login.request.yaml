$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/google'
order: 2500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "idToken": "eyJhbGciOiJSUzI1NiIsImtpZCI6Imdvb2dsZS1qd2tzLWtleS1pZCJ9.replace-with-google-oidc-id-token"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns authenticated session tokens', () => {
        const json = pm.response.json();
        pm.expect(json.data.tokens.accessToken).to.be.a('string');
        pm.expect(json.data.tokens.refreshToken).to.be.a('string');
      });
