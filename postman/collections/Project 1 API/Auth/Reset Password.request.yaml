$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/reset-password'
order: 5500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "replace-with-raw-reset-token-from-email",
      "newPassword": "updated-correct-horse-battery-staple"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 204 No Content', () => {
        pm.response.to.have.status(204);
      });
