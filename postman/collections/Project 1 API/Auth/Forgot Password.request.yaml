$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/forgot-password'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "ada@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 202 Accepted (anti-enumeration)', () => {
        pm.response.to.have.status(202);
      });
