$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "new.customer@tsuzumi.test",
      "password": "correct-horse-battery-staple",
      "name": "Ada Lovelace",
      "phone": "+6281234567890",
      "address": "Jl. Pangeran Jayakarta No. 129, Jakarta Pusat"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201 Created', () => {
        pm.response.to.have.status(201);
      });
      pm.test('Returns user and Bearer token pair', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.user.id).to.be.a('string');
        pm.expect(json.data.tokens.tokenType).to.eql('Bearer');
        pm.expect(json.data.tokens.accessToken).to.be.a('string');
        pm.expect(json.data.tokens.refreshToken).to.be.a('string');
      });