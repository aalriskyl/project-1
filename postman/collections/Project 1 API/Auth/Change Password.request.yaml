$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/change-password'
order: 5500
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "correct-horse-battery-staple",
      "newPassword": "brand-new-strong-passphrase-2026"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 204 No Content', () => {
        pm.response.to.have.status(204);
      });