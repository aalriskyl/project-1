$kind: http-request
method: POST
url: '{{baseUrl}}/v1/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@tsuzumi.test",
      "password": "TsuzumiAdmin2026!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 OK', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns authenticated session tokens', () => {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.tokens.accessToken).to.be.a('string');
        pm.expect(json.data.tokens.refreshToken).to.be.a('string');
      });
