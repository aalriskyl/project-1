services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_1_test
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d project_1_test']
      interval: 5s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_1_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d project_1_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # Development-only convenience stack. Do not use as a production deployment
  # template: production must set NODE_ENV=production and satisfy env.ts checks.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/project_1_dev
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/project_1_dev
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-dev-only-secret-change-in-production-min-32-chars
      JWT_ISSUER: project-1-api
      JWT_AUDIENCE: project-1-client

volumes:
  pgdata:
